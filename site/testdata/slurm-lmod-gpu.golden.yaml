# cairn site profile.
#
# Generated by `cairn init`, which probed this host and wrote down what it found.
# It is meant to be read, corrected, and committed to git — cairn guesses, and a
# guess an admin has not checked is not a site profile.
#
# Where a value is wrong, edit it. `cairn init` will not overwrite this file
# without --force, and will show you what it would change.
#
# Unknown keys are an error rather than being ignored, so a typo here fails
# loudly instead of silently reverting to whatever was probed.

# Format version of this file, not cairn's event schema.
version: 1
# The name stamped on every event collected here. Two clusters sharing a
# name make two sites' bundles look like one site's, so make it unique.
cluster: cluster-a
# The batch system. This is the single most load-bearing value in the file:
# it is what stops a model answering a Slurm question with PBS syntax.
scheduler:
  kind: slurm
  version: 23.02.7
  config_path: /etc/slurm/slurm.conf
  partitions:
    - batch
    - debug
    - gpu
  qos:
    - high
    - normal
    - preempt
# Environment modules. Needed to answer "why can't I load this module"
# against what this site actually publishes.
modules:
  kind: lmod
  roots:
    - /apps/modulefiles/Compiler
    - /apps/modulefiles/Core
# Spack and EasyBuild installation roots.
builders:
  - kind: spack
    root: /apps/spack
  - kind: easybuild
    root: /apps/easybuild
# Base system. Drift in these is invisible until jobs die.
os:
  id: rocky
  version_id: "9.3"
  kernel_release: 5.14.0-362.18.1.el9_3.x86_64
  glibc_version: "2.34"
# High-speed interconnect.
fabric:
  kind: infiniband
  hcas:
    - mlx5_0
    - mlx5_1
  rates:
    - "200"
# Accelerators.
gpu:
  vendor: nvidia
  driver_version: 550.54.14
  cuda_version: "12.4"
  models:
    - NVIDIA H100 80GB HBM3
  dcgm: true
# Shared filesystems. The root filesystem and other node-local mounts are
# omitted: what matters is what a submission script can reference.
mounts:
  - mountpoint: /home
    fstype: nfs4
    source: "198.51.100.5:/export/home"
  - mountpoint: /scratch
    fstype: lustre
    source: "192.0.2.10@o2ib:/lustre"
# Out-of-band management.
bmc:
  kind: ipmi
  reachable: false
# Telemetry already deployed here. cairn reads from these where present
# rather than asking anyone to replace them.
metrics:
  - kind: prometheus
# What cairn looked for and did not find.
#
# Usually correct — a CPU-only site has no GPU stack, and a tenant node has
# no BMC. Recorded so that a thin profile reads as an incompletely probed
# one rather than a simple site, because those need opposite responses.
#
# Anything here that you know to be present, cairn could not reach. Fill in
# the section above by hand and delete the entry.
gaps:
  - name: bmc
    level: privileged
    detail: ipmitool present but not run; set the endpoint here by hand if you want BMC evidence
