id: 005-ib-link-flap
title: InfiniBand port flapping under a marginal cable, killing an MPI job
cluster: cluster-a
# What this fixture is about: the job under investigation, and the node the
# captures were taken on.
incident:
  job: "918633"
  node: node-0045

synthetic: true

expected_classes:
  - app.nonzero_exit
  - fabric.link_flap

expected_root_cause: >-
  The HCA on node-0045 reported a cable module event and its port then cycled
  Down/Up three times in about eighty seconds before settling in Down/Polling.
  The MPI job lost its transport and exited nonzero. The remediation is physical
  — reseat or replace the cable — and the node should be drained, not retried.

producers:
  - fabric
  - journal
  - slurm

capability: unprivileged

scheduler:
  name: slurm
  version: "23.11.6"

redacted_by: ""
redaction_method: ""

notes: >-
  Authored, not observed.

  Every link transition is a separate event on purpose. The *count* is the
  diagnosis: one Down/Up is a reconfiguration, five in eighty seconds is a
  failing cable. Any future deduplication that collapses repeated signatures must
  preserve the count, and this fixture is the test that will catch it if it does
  not.

  The rate of 10 in the ibstat capture is the down-port reading, not the link's
  negotiated rate. It is left as captured rather than corrected, because a
  collector has to cope with what the tool actually prints.

  input/.redaction-ok records one reviewed scanner exception. GUIDs are replaced
  with zeroed placeholders that keep the fabric topology intact — the same
  placeholder appears everywhere the original did — while carrying no information
  about the hardware.

  THIS FIXTURE ONCE EXPECTED A `fabric` EVENT. It was removed, and it should not
  be re-added. The event claimed `flap_count: 5` and a timestamp of 10:03:29,
  and input/ibstat.txt can supply neither: the flap count is a tally of the
  *journal's* transitions, which the journal collector already emits, and ibstat
  prints no time at all — not on this capture, not ever. It was authored from
  the incident rather than from the input, which is the mistake README's
  "Writing the expected stream" describes and the fourth fixture to have made
  it, after 001, 002 and 003.

  `producers` still lists fabric, and ibstat.txt is still read: the fabric
  collector reports whether the port is visible and what state it is in. It just
  has nothing it can honestly place on a timeline. The port really was
  Down/Polling and that is still the diagnosis — see expected_root_cause — and
  the state is compared against the node's siblings by `cairn diff`, which needs
  no timestamp because a node profile carries its own.
